name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios-app/**", "docs/index.html", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'net.foldworlds.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the latest worlds page in the app
        run: cp docs/index.html ios-app/FoldWorlds/index.html

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios-app && xcodegen generate

      # Always: build without signing, to check it compiles, and package an unsigned .ipa
      # (for sideloading with a free Apple ID through Sideloadly / AltStore, which re-sign it).
      - name: Build (unsigned)
        run: |
          cd ios-app
          xcodebuild -project FoldWorlds.xcodeproj -scheme FoldWorlds -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/FoldWorlds.app Payload/
          zip -qry FoldWorlds-unsigned.ipa Payload

      - name: Publish the unsigned .ipa as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Fold Worlds for iOS (latest)
          prerelease: true
          files: ios-app/FoldWorlds-unsigned.ipa
          body: |
            Unsigned build of the Fold Worlds iOS app, for sideloading with Sideloadly or AltStore
            (they sign it with your own Apple ID). TestFlight builds go straight to App Store Connect
            once the Apple secrets are set up - see README.

      # Only when the Apple developer secrets are set: sign and upload to TestFlight.
      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8_BASE64 != '' && env.APPLE_TEAM_ID != ''
        run: |
          cd ios-app
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist
          xcodebuild -project FoldWorlds.xcodeproj -scheme FoldWorlds -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FoldWorlds.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          xcodebuild -exportArchive -archivePath build/FoldWorlds.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
